{{ define "content" }}
<main
  class="flex flex-col items-center justify-center h-dvh"
  hx-ext="ws"
  ws-connect="/buzz"
  ws-send="{{.Name}}"
  hx-target="player-data"
  hx-swap="outerHTML swap:1s"
>
  <h1 class="text-3xl text-center">Hi {{ .Name }}!</h1>
  <form ws-send>
    <input name="name" value="{{.Name}}" hidden />
    <div
      id="player-data"
      class="w-60 aspect-square flex justify-center items-center"
    >
      {{ block "loading-spinner" . }}{{ end }}
    </div>
  </form>
</main>
{{ end }}
