{{ define "content" }}
<main class="flex flex-col items-center p-2">
  <h1 class="text-4xl p-2 font-semibold m-4">Admin Panel</h1>
  {{ block "admin-form" . }}{{ end }}
  <div
    class="flex max-sm:flex-col w-full justify-around max-sm:items-center max-w-[1000px] my-6 gap-8"
  >
    <div class="w-1/2 min-w-xs">
      {{ block "table-display" .Leaderboard }}{{ end }}
    </div>
    <div class="w-1/2 min-w-xs">
      {{ block "table-display" .BuzzedIn }}{{ end }}
    </div>
  </div>
</main>

{{ end }}
