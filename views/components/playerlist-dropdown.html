{{ define "playerlist-dropdown" }}
<select
  id="playerlist-dropdown"
  name="name"
  class="min-w-3xs py-3 px-4 pe-9 block w-full border border-gray-400 rounded-lg text-sm focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600 appearance-auto"
>
  <option value="">[Select Player]</option>
  {{ range $i, $playerName := .PlayerList }}
  <option value="{{$playerName}}">{{ $playerName }}</option>
  {{ end }}
</select>
{{ end }}
