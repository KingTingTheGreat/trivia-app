{{ define "playerlist-dropdown" }}
<select
  id="playerlist-dropdown"
  name="name"
  class="min-w-3xs py-3 px-4 pe-9 block w-full border border-gray-400 rounded-lg text-sm focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
  style="
    background-image: url(&quot;data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e&quot;);
    background-repeat: no-repeat;
    background-position: right 0.75rem center;
    background-size: 1rem;
    appearance: none;
  "
>
  <option value="">[Select Player]</option>
  {{ range $i, $playerName := .PlayerList }}
  <option value="{{$playerName}}">{{ $playerName }}</option>
  {{ end }}
</select>
{{ end }}
