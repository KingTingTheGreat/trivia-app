{{ define "table-display" }}
<div
  id="{{.TableId}}-container"
  hx-ext="ws"
  ws-connect="{{ .Endpoint }}"
  hx-target="#{{.TableId}}-table"
  hx-swap="innerHTML"
>
  <div id="{{.TableId}}" class="flex flex-col items-center gap-6">
    <div class="text-center">
      <h1 class="text-4xl max-sm:text-3xl font-bold">{{ .Title }}</h1>
      <p class="mt-2 text-gray-400 text-sm">{{ .Description }}</p>
    </div>
    <div id="{{.TableId}}-table">{{ block "loading-spinner" . }}{{ end }}</div>
  </div>
</div>
{{ end }}
