{{ define "admin-form" }}
<div class="flex w-full justify-around max-w-[750px]">
  <form
    id="admin-form"
    class="flex flex-col gap-6"
    hx-include="[id='password']"
    hx-target="#error"
  >
    <div class="px-4 flex flex-col items-center">
      <div class="flex flex-col">
        <label for="password" class="p-1">Enter Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Password"
          autocomplete="current-password"
          required
          class="py-2.5 sm:py-3 px-4 block border border-gray-400 rounded-lg sm:text-sm focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none"
        />
      </div>
      <div id="error">{{ block "error-message" . }}{{ end }}</div>
    </div>

    <div class="px-2 flex flex-col md:flex-row md:items-start">
      <div class="flex justify-center items-center gap-2">
        {{ block "playerlist-dropdown-ws" . }}{{ end }}
        <input
          id="amount"
          name="amount"
          type="number"
          class="w-20 py-2.5 sm:py-3 px-4 block border border-gray-400 rounded-lg sm:text-sm focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none [appearance:textfield] [moz-appearance:textfield] /* Remove spinners in all states */ [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none hover:[&::-webkit-inner-spin-button]:appearance-none hover:[&::-webkit-outer-spin-button]:appearance-none focus:[&::-webkit-inner-spin-button]:appearance-none focus:[&::-webkit-outer-spin-button]:appearance-none active:[&::-webkit-inner-spin-button]:appearance-none active:[&::-webkit-outer-spin-button]:appearance-none"
          placeholder="#"
        />
      </div>
      <div
        class="flex md:flex-col justify-around md:max-w-40 gap-2 ml-2 mt-2 md:mt-0"
        hx-vals='js:{name: document.getElementById("playerlist-dropdown").value}'
      >
        <button
          hx-put="/auth/player"
          hx-vals='js:{amount: document.getElementById("amount").value, action: "update"}'
          class="cursor-pointer text-sm text-white bg-blue-700 hover:bg-blue-800 rounded-lg px-5 py-3.5"
        >
          Add To Score
        </button>
        <button
          hx-put="/auth/player"
          hx-vals='{"action": "clear"}'
          class="cursor-pointer text-sm text-gray-900 bg-white border border-gray-300 hover:bg-gray-100 rounded-lg px-5 py-3.5"
        >
          Clear Score
        </button>
        <button
          hx-delete="/auth/player"
          hx-confirm="Are you sure you want to delete this player? This action is permanent."
          class="cursor-pointer text-sm text-white bg-red-700 hover:bg-red-800 rounded-lg px-5 py-3.5"
        >
          Remove Player
        </button>
      </div>
    </div>

    <div class="px-2 flex flex-col items-center gap-2">
      <button
        hx-post="/auth/reset-buzzers"
        class="cursor-pointer text-sm text-white bg-blue-700 hover:bg-blue-800 rounded-lg px-5 py-3.5 w-40"
      >
        Reset Buzzers
      </button>
      <button
        hx-post="/auth/reset-game"
        hx-confirm="Are you sure you want to reset the game? This action is permanent."
        class="cursor-pointer text-sm text-white bg-red-700 hover:bg-red-800 rounded-lg px-5 py-3.5 w-40"
      >
        Reset Game
      </button>
    </div>
  </form>
</div>
{{ end }}
